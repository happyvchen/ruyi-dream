services:
  backend:
    environment:
      APP_S3_ENDPOINT_URL: http://rustfs:9000

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.1@sha256:3c2d55977829620284ece8593901bf776bcfc0fc9972784352de4dcffdb92416
    container_name: ruyi-dream-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${APP_S3_ACCESS_KEY_ID:?set APP_S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${APP_S3_SECRET_ACCESS_KEY:?set APP_S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs
    command:
      - --address
      - :9000
      - --console-enable
      - /data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATA_ROOT:-./deployment}/rustfs/data:/data
      - ${DATA_ROOT:-./deployment}/rustfs/config:/etc/rustfs
      - ${DATA_ROOT:-./deployment}/rustfs/certs:/certs:ro
      - ${DATA_ROOT:-./deployment}/rustfs/logs:/var/log/rustfs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
