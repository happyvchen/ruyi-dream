services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.1
    container_name: ruyi-dream-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-127.0.0.1}
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs
    command:
      - --address
      - :9000
      - --console-enable
      - /data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./deployment/rustfs/data:/data
      - ./deployment/rustfs/config:/etc/rustfs
      - ./deployment/rustfs/certs:/certs:ro
      - ./deployment/rustfs/logs:/var/log/rustfs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  backend:
    container_name: ruyi-dream-backend
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - rustfs
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DATA_DIR: /app/data
      APP_DATABASE_PATH: /app/data/app.sqlite3
      APP_LOG_DIR: /app/data/logs
      APP_S3_ENDPOINT_URL: http://rustfs:9000
      APP_S3_PUBLIC_ENDPOINT_URL: ${PUBLIC_S3_URL:-http://127.0.0.1:9000}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-ruyi-dream}
      APP_S3_REGION: auto
      APP_S3_FORCE_PATH_STYLE: "true"
      APP_S3_PRESIGN_EXPIRES_SECONDS: 900
      APP_MAX_UPLOAD_IMAGE_BYTES: ${APP_MAX_UPLOAD_IMAGE_BYTES:-15728640}
      APP_MAX_UPLOAD_IMAGE_PIXELS: ${APP_MAX_UPLOAD_IMAGE_PIXELS:-25000000}
      APP_MAX_GARMENT_IMAGES_PER_SKU: ${APP_MAX_GARMENT_IMAGES_PER_SKU:-20}
      APP_MAX_HEAD_REFERENCES_PER_PROFILE: ${APP_MAX_HEAD_REFERENCES_PER_PROFILE:-20}
      APP_API_ACCESS_TOKEN: ${APP_API_ACCESS_TOKEN:-}
      APP_TRUST_REVERSE_PROXY_AUTH: ${APP_TRUST_REVERSE_PROXY_AUTH:-false}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GPT_IMAGE2_PROVIDER: ${GPT_IMAGE2_PROVIDER:-fal}
      GPT_IMAGE2_MODEL_ID: ${GPT_IMAGE2_MODEL_ID:-openai/gpt-image-2/edit}
      GPT_IMAGE2_API_BASE_URL: ${GPT_IMAGE2_API_BASE_URL:-https://fal.run/openai/gpt-image-2/edit}
      GPT_IMAGE2_QUEUE_URL: ${GPT_IMAGE2_QUEUE_URL:-https://queue.fal.run/openai/gpt-image-2/edit}
      FAL_KEY: ${FAL_KEY:-}
      GPT_IMAGE2_QUALITY: ${GPT_IMAGE2_QUALITY:-high}
      GPT_IMAGE2_OUTPUT_FORMAT: ${GPT_IMAGE2_OUTPUT_FORMAT:-png}
      GENERATION_POLL_INTERVAL_SECONDS: ${GENERATION_POLL_INTERVAL_SECONDS:-5}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./deployment/app-data/backend:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  frontend:
    container_name: ruyi-dream-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
        VITE_API_ACCESS_TOKEN: ${APP_API_ACCESS_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
