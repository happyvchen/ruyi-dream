services:
  backend:
    container_name: ruyi-dream-backend
    build:
      context: ./backend
      args:
        # 部署校验：GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DATA_DIR: /app/data
      APP_DATABASE_PATH: /app/data/app.sqlite3
      APP_LOG_DIR: /app/data/logs
      APP_S3_ENDPOINT_URL: ${APP_S3_ENDPOINT_URL:-http://127.0.0.1:9000}
      APP_S3_PUBLIC_ENDPOINT_URL: ${APP_S3_PUBLIC_ENDPOINT_URL:-${PUBLIC_S3_URL:-http://127.0.0.1:9000}}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-${APP_STORAGE_BUCKET:-ruyi-dream}}
      APP_S3_REGION: ${APP_S3_REGION:-auto}
      APP_S3_FORCE_PATH_STYLE: ${APP_S3_FORCE_PATH_STYLE:-true}
      APP_S3_PRESIGN_EXPIRES_SECONDS: ${APP_S3_PRESIGN_EXPIRES_SECONDS:-900}
      APP_MAX_UPLOAD_IMAGE_BYTES: ${APP_MAX_UPLOAD_IMAGE_BYTES:-15728640}
      APP_MAX_UPLOAD_IMAGE_PIXELS: ${APP_MAX_UPLOAD_IMAGE_PIXELS:-25000000}
      APP_MAX_GARMENT_IMAGES_PER_SKU: ${APP_MAX_GARMENT_IMAGES_PER_SKU:-20}
      APP_MAX_HEAD_REFERENCES_PER_PROFILE: ${APP_MAX_HEAD_REFERENCES_PER_PROFILE:-20}
      APP_USER_USERNAME: ${APP_USER_USERNAME:-user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-}
      APP_USER_PASSWORD_HASH: ${APP_USER_PASSWORD_HASH:-}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-43200}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_API_ACCESS_TOKEN: ${APP_API_ACCESS_TOKEN:-}
      APP_TRUST_REVERSE_PROXY_AUTH: ${APP_TRUST_REVERSE_PROXY_AUTH:-false}
      APP_S3_ACCESS_KEY_ID: ${APP_S3_ACCESS_KEY_ID:-}
      APP_S3_SECRET_ACCESS_KEY: ${APP_S3_SECRET_ACCESS_KEY:-}
      GEMINI_PROVIDER: ${GEMINI_PROVIDER:-direct}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GEMINI_TOAPIS_MODEL: ${GEMINI_TOAPIS_MODEL:-}
      GEMINI_TOAPIS_TIMEOUT_SECONDS: ${GEMINI_TOAPIS_TIMEOUT_SECONDS:-300}
      GPT_IMAGE2_PROVIDER: ${GPT_IMAGE2_PROVIDER:-toapis}
      GPT_IMAGE2_MODEL_ID: ${GPT_IMAGE2_MODEL_ID:-gpt-image-2}
      GPT_IMAGE2_API_BASE_URL: ${GPT_IMAGE2_API_BASE_URL:-https://fal.run/openai/gpt-image-2/edit}
      GPT_IMAGE2_QUEUE_URL: ${GPT_IMAGE2_QUEUE_URL:-https://queue.fal.run/openai/gpt-image-2/edit}
      FAL_KEY: ${FAL_KEY:-}
      TOAPIS_API_KEY: ${TOAPIS_API_KEY:-}
      TOAPIS_BASE_URL: ${TOAPIS_BASE_URL:-https://toapis.com}
      GPT_IMAGE2_SIZE: ${GPT_IMAGE2_SIZE:-1:1}
      GPT_IMAGE2_RESOLUTION: ${GPT_IMAGE2_RESOLUTION:-1K}
      GPT_IMAGE2_QUALITY: ${GPT_IMAGE2_QUALITY:-high}
      GPT_IMAGE2_OUTPUT_FORMAT: ${GPT_IMAGE2_OUTPUT_FORMAT:-png}
      GENERATION_POLL_INTERVAL_SECONDS: ${GENERATION_POLL_INTERVAL_SECONDS:-5}
      GENERATION_LOCK_TTL_SECONDS: ${GENERATION_LOCK_TTL_SECONDS:-120}
      GENERATION_IMAGE_TIMEOUT_SECONDS: ${GENERATION_IMAGE_TIMEOUT_SECONDS:-1800}
      GENERATION_SUBMIT_RETRY_LIMIT: ${GENERATION_SUBMIT_RETRY_LIMIT:-3}
      GENERATION_STATUS_RETRY_LIMIT: ${GENERATION_STATUS_RETRY_LIMIT:-6}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${DATA_ROOT:-./deployment}/app-data/backend:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  frontend:
    container_name: ruyi-dream-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
